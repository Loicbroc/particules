<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b15" />
    <meta name="description" content="Particules : une expérience visuelle de reconstruction de photos par particules." />
    <title>Particules</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 25%, #17213b, #080b15 65%); color: #edf3ff; padding: 2rem; }
      main { max-width: 38rem; }
      .label { color: #a4b6db; letter-spacing: .2em; text-transform: uppercase; font-size: .75rem; }
      h1 { margin: 1rem 0; font-size: clamp(3rem, 10vw, 6rem); font-weight: 500; letter-spacing: -.06em; }
      p { color: #acb8d0; line-height: 1.7; }
      .status { display: inline-block; margin-top: 1rem; padding: .6rem 1rem; border: 1px solid #34405b; border-radius: 2rem; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">Expérience Three.js</span>
      <h1>Particules</h1>
      <p>Une photo, des milliers de particules en mouvement. Le projet est initialisé ; l’expérience interactive est en cours de développement.</p>
      <p class="status">Projet initialisé</p>
    </main>
  </body>
</html>
